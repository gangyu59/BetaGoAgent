<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetaGo Agent Visualization</title>
    <link rel="stylesheet" href="static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>BetaGo Agent</h1>
            <div class="stats-panel">
                <h3>Training Metrics</h3>
                <p>Self-Play Games: <span id="game-count">0</span></p>
                <p>Policy Accuracy: <span id="training-win-rate">0.0</span>%</p>
                <div style="font-size: 12px; margin-bottom: 5px;">
                    Policy Loss: <span id="p-loss-val">0.00</span> | Value Loss: <span id="v-loss-val">0.00</span>
                </div>
                <canvas id="lossChart"></canvas>
            </div>
            <div class="game-info">
                <h3>Game Status</h3>
                <p>Turn: <span id="turn-indicator">Black</span></p>
                <p>Moves: <span id="move-count">0</span></p>
                <div class="win-rate-bar">
                    <div id="win-rate-fill" style="width: 50%;"></div>
                    <span id="win-rate-text">50%</span>
                </div>
            </div>
            <div class="controls">
                <button id="btn-train" onclick="toggleTraining()">Start Training</button>
                <button id="btn-new-game" onclick="newGame()">New Game</button>
                <button onclick="toggleHeatmap()">Toggle Heatmap</button>
            </div>
            <div id="status-log" style="margin-top: 20px; color: #aaa; font-size: 12px;"></div>
        </div>
        <div class="main-area">
            <div id="board-container">
                <div id="ai-hourglass"><div class="spinner"></div></div>
                <canvas id="go-board" width="600" height="600"></canvas>
            </div>
            <div id="chart-container">
                <div id="training-overlay">
                    <div class="overlay-msg">Initializing training chart...</div>
                    <div class="buffer-bar"><div id="buffer-fill"></div></div>
                </div>
                <canvas id="lossChartLarge"></canvas>
            </div>
        </div>
    </div>
    <script src="static/js/script.js"></script>
</body>
</html>
